name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      # A SIGKILLed probe once left a mutant in a committed fixture. This is the
      # check that would have caught it at the commit that introduced it.
      - name: no mutation artifacts committed
        run: ./scripts/no-mutants-committed.sh

      - name: unit tests
        run: npx vitest run

      # canfail must catch every planted defect in the fixture and report nothing
      # else. A detector that quietly stops working turns this step red.
      - name: fixture verification
        run: node dist/bin/canfail.js verify-fixtures fixtures/greenwashed-app

      # The negative case: a genuinely tested module must produce zero findings.
      - name: clean fixture reports nothing
        run: node dist/bin/canfail.js scan fixtures/clean-app

      # And the gate above must itself be capable of failing.
      - name: prove the gate can fail
        run: ./scripts/prove-gate-can-fail.sh

      # canfail prove, end to end against a throwaway git repo: the greenwashed
      # test must exit 1 and the honest one must exit 0.
      - name: prove demo
        run: ./scripts/demo-prove.sh

      # Same invariant, a real Go module, no TypeScript involved.
      - name: prove demo (Go)
        run: ./scripts/demo-prove-go.sh

      # Self-hosting gate: canfail's own tests may not be vacuous.
      - name: canfail scans canfail
        run: node dist/bin/canfail.js scan . --exclude fixtures --no-mutate
